<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CODE IMPOSTER | Astra 11.0</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-black: #06050a;
            --panel-bg: rgba(18, 16, 26, 0.88);
            --imposter-red: #ff1e43;
            --dark-red: #9e0b24;
            --violet: #7c3aed;
            --cyan-glow: #00f0ff;
            --green-glow: #00ff66;
            --text-light: #f3f4f6;
            --muted-text: #9ca3af;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Rajdhani', sans-serif;
        }

        body {
            background-color: var(--bg-black);
            color: var(--text-light);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Animated Space Canvas Background */
        #space-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            background: radial-gradient(circle at center, #1b0c33 0%, var(--bg-black) 85%);
        }

        /* Navbar / Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 6%;
            background: rgba(6, 5, 10, 0.9);
            backdrop-filter: blur(12px);
            border-bottom: 2px solid var(--imposter-red);
            box-shadow: 0 4px 20px rgba(255, 30, 67, 0.2);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.2rem;
            font-weight: 800;
            letter-spacing: 2px;
            color: #fff;
        }

        .header-title span {
            color: var(--imposter-red);
            text-shadow: 0 0 10px rgba(255, 30, 67, 0.6);
        }

        .sub-header {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.95rem;
            color: var(--cyan-glow);
            letter-spacing: 1.5px;
            font-weight: 600;
        }

        /* Container Layout */
        .container {
            max-width: 700px;
            margin: 50px auto;
            padding: 0 20px;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        /* Main Heading Card */
        .main-heading-card {
            text-align: center;
            background: var(--panel-bg);
            border: 2px solid var(--imposter-red);
            border-radius: 12px;
            padding: 25px 20px;
            box-shadow: 0 0 25px rgba(255, 30, 67, 0.3);
            position: relative;
            overflow: hidden;
        }

        .main-heading-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 30, 67, 0.15), transparent);
            animation: sweep 4s infinite;
        }

        @keyframes sweep {
            0% { left: -100%; }
            50%, 100% { left: 100%; }
        }

        .main-heading-card h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.8rem;
            font-weight: 900;
            letter-spacing: 4px;
            color: #fff;
            text-shadow: 0 0 15px rgba(255, 30, 67, 0.7);
        }

        /* Stopwatch Card */
        .timer-box {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(10, 20, 35, 0.9);
            border: 2px solid var(--cyan-glow);
            border-radius: 10px;
            padding: 18px 30px;
            box-shadow: 0 0 18px rgba(0, 240, 255, 0.25);
        }

        .timer-label {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.1rem;
            color: var(--muted-text);
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .live-dot {
            width: 14px;
            height: 14px;
            background-color: var(--green-glow);
            border-radius: 50%;
            box-shadow: 0 0 12px var(--green-glow);
            animation: pulse 1s infinite alternate;
        }

        @keyframes pulse {
            from { opacity: 0.3; transform: scale(0.85); }
            to { opacity: 1; transform: scale(1.15); }
        }

        .timer-display {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.6rem;
            font-weight: 900;
            color: var(--green-glow);
            text-shadow: 0 0 15px rgba(0, 255, 102, 0.6);
            letter-spacing: 4px;
        }

        /* Form Panel */
        .panel {
            background: var(--panel-bg);
            border: 2px solid var(--violet);
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 0 20px rgba(124, 58, 237, 0.3);
            backdrop-filter: blur(8px);
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .input-group label {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.95rem;
            color: var(--cyan-glow);
            letter-spacing: 1.5px;
        }

        .participant-input {
            width: 100%;
            background: rgba(6, 5, 10, 0.9);
            border: 1px solid var(--violet);
            border-radius: 6px;
            padding: 14px;
            color: #fff;
            font-size: 1.05rem;
            outline: none;
            transition: all 0.2s;
        }

        .participant-input:focus {
            border-color: var(--cyan-glow);
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.3);
        }

        /* Submit Button */
        .btn-container {
            display: flex;
            justify-content: flex-end;
            margin-top: 25px;
        }

        .submit-btn {
            background: linear-gradient(135deg, var(--dark-red), var(--imposter-red));
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            font-size: 1.1rem;
            font-weight: 800;
            padding: 15px 45px;
            border: 2px solid #000;
            border-radius: 50px;
            cursor: pointer;
            letter-spacing: 2px;
            box-shadow: 0 0 20px rgba(255, 30, 67, 0.5);
            transition: all 0.25s ease;
            width: 100%;
        }

        .submit-btn:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 0 30px rgba(255, 30, 67, 0.85);
            background: linear-gradient(135deg, var(--imposter-red), #ff4d6d);
        }

        /* Confirmation Message */
        .status-msg {
            display: none;
            margin-top: 25px;
            padding: 20px;
            background: rgba(0, 255, 102, 0.08);
            border: 2px solid var(--green-glow);
            border-radius: 8px;
            color: var(--green-glow);
            font-family: 'Orbitron', sans-serif;
            text-align: center;
            font-size: 1.1rem;
            line-height: 1.6;
            box-shadow: 0 0 20px rgba(0, 255, 102, 0.2);
        }
    </style>
</head>
<body>

    <!-- Space Background -->
    <canvas id="space-bg"></canvas>

    <!-- Header Navigation -->
    <header>
        <div class="header-title">
            ST. JOSEPH'S COLLEGE OF ENG. & TECH. | <span>ASTRA 11.0</span>
        </div>
        <div class="sub-header">
            SUBMISSION MODULE
        </div>
    </header>

    <!-- Main Container -->
    <div class="container">

        <!-- Heading Section -->
        <div class="main-heading-card">
            <h1>CODE IMPOSTER</h1>
        </div>

        <!-- Live Stopwatch Timer -->
        <div class="timer-box">
            <span class="timer-label">
                <span class="live-dot" id="live-dot"></span> 
                SUBMISSION TIMER (MM:SS):
            </span>
            <span class="timer-display" id="timer">00:00</span>
        </div>

        <!-- Submission Form -->
        <div class="panel">
            <form id="imposter-form" onsubmit="submitTask(event)">
                <div class="input-group">
                    <label for="participant-id">PARTICIPANT NAME</label>
                    <input type="text" id="participant-id" class="participant-input" placeholder="Enter Participant Name" required>
                </div>

                <div class="btn-container">
                    <button type="submit" id="submit-btn" class="submit-btn">SUBMIT</button>
                </div>
            </form>

            <div id="status-msg" class="status-msg"></div>
        </div>

    </div>

    <!-- JavaScript Logic -->
    <script>
        var API_BASE = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' || window.location.hostname === '')
            ? 'http://localhost:3000'
            : '';

        // 1. Space Canvas Animation
        const canvas = document.getElementById('space-bg');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const stars = [];
        const starColors = ['#ffffff', '#ff1e43', '#00f0ff', '#7c3aed'];

        for (let i = 0; i < 160; i++) {
            stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                radius: Math.random() * 1.8,
                color: starColors[Math.floor(Math.random() * starColors.length)],
                speed: Math.random() * 0.4 + 0.1
            });
        }

        function animateSpace() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            stars.forEach(star => {
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
                ctx.fillStyle = star.color;
                ctx.fill();

                star.y += star.speed;
                if (star.y > canvas.height) {
                    star.y = 0;
                    star.x = Math.random() * canvas.width;
                }
            });
            requestAnimationFrame(animateSpace);
        }
        animateSpace();

        // 2. Stopwatch Logic (MM:SS)
        const startTime = Date.now();
        let timerInterval = null;

        function updateTimer() {
            const elapsedMs = Date.now() - startTime;
            const totalSeconds = Math.floor(elapsedMs / 1000);
            const minutes = Math.floor(totalSeconds / 60);
            const seconds = totalSeconds % 60;

            const formattedMin = String(minutes).padStart(2, '0');
            const formattedSec = String(seconds).padStart(2, '0');

            document.getElementById('timer').textContent = `${formattedMin}:${formattedSec}`;
        }

        updateTimer();
        timerInterval = setInterval(updateTimer, 1000);

        function escHtml(s) {
            return String(s == null ? '' : s)
                .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
                .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
        }

        // 3. Form Submission
        async function submitTask(event) {
            event.preventDefault();

            const recordTime      = document.getElementById('timer').textContent;
            const participantName = document.getElementById('participant-id').value.trim();
            const submitBtn       = document.getElementById('submit-btn');
            const statusMsg       = document.getElementById('status-msg');

            if (!participantName) return;

            submitBtn.disabled     = true;
            submitBtn.textContent  = 'SUBMITTING...';
            submitBtn.style.opacity = '0.7';

            try {
                const res  = await fetch(API_BASE + '/api/code-imposter/submit', {
                    method:  'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body:    JSON.stringify({
                        participant_name: participantName,
                        completion_time:  recordTime
                    })
                });
                const data = await res.json();

                // Freeze timer regardless of server response
                clearInterval(timerInterval);

                // Turn off glowing live dot
                const dot = document.getElementById('live-dot');
                dot.style.animation       = 'none';
                dot.style.backgroundColor = '#555';
                dot.style.boxShadow       = 'none';

                // Lock input field
                document.getElementById('participant-id').disabled = true;
                submitBtn.style.opacity = '0.5';
                submitBtn.style.cursor  = 'not-allowed';

                if (res.ok && data && data.success) {
                    submitBtn.textContent     = 'SUBMITTED';
                    statusMsg.style.display   = 'block';
                    statusMsg.style.borderColor = 'var(--green-glow)';
                    statusMsg.style.color       = 'var(--green-glow)';
                    statusMsg.innerHTML =
                        '&#10003; SUBMISSION SUCCESSFUL!<br>' +
                        'Participant: <strong>' + escHtml(participantName) + '</strong><br>' +
                        'Final Time: <strong>' + escHtml(recordTime) + ' (MM:SS)</strong>';
                } else if (res.status === 409 && data && data.already_submitted) {
                    // Already submitted — show the existing time
                    submitBtn.textContent     = 'ALREADY SUBMITTED';
                    statusMsg.style.display   = 'block';
                    statusMsg.style.borderColor = 'var(--green-glow)';
                    statusMsg.style.color       = 'var(--green-glow)';
                    statusMsg.innerHTML =
                        '&#10003; Already submitted.<br>' +
                        'Participant: <strong>' + escHtml(participantName) + '</strong><br>' +
                        'Recorded Time: <strong>' + escHtml(data.completion_time || recordTime) + '</strong>';
                } else {
                    // Server rejected — still lock UI (time is recorded) but show warning
                    submitBtn.textContent     = 'SUBMITTED';
                    statusMsg.style.display   = 'block';
                    statusMsg.style.borderColor = '#ff8c00';
                    statusMsg.style.color       = '#ff8c00';
                    const serverMsg = (data && data.message) ? escHtml(data.message) : 'Server could not save — inform coordinator.';
                    statusMsg.innerHTML =
                        '&#9888; Time recorded locally.<br>' +
                        'Participant: <strong>' + escHtml(participantName) + '</strong><br>' +
                        'Final Time: <strong>' + escHtml(recordTime) + '</strong><br>' +
                        '<small>' + serverMsg + '</small>';
                }
            } catch (err) {
                // Network error — still freeze/lock but warn
                clearInterval(timerInterval);
                const dot = document.getElementById('live-dot');
                dot.style.animation = 'none'; dot.style.backgroundColor = '#555'; dot.style.boxShadow = 'none';
                document.getElementById('participant-id').disabled = true;
                submitBtn.textContent   = 'SUBMITTED (OFFLINE)';
                submitBtn.style.opacity = '0.5';
                submitBtn.style.cursor  = 'not-allowed';
                statusMsg.style.display     = 'block';
                statusMsg.style.borderColor = '#ff8c00';
                statusMsg.style.color       = '#ff8c00';
                statusMsg.innerHTML =
                    '&#9888; Time recorded locally (server unreachable).<br>' +
                    'Participant: <strong>' + escHtml(participantName) + '</strong><br>' +
                    'Final Time: <strong>' + escHtml(recordTime) + '</strong><br>' +
                    '<small>Inform the coordinator to record this manually.</small>';
            }
        }
    </script>
</body>
</html>
