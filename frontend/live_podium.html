<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIVE PODIUM | ASTRA 11.0</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-black: #08070b;
            --charcoal: #121018;
            --gold: #ffd700;
            --silver: #c0c0c0;
            --bronze: #cd7f32;
            --crimson: #ff1e43;
            --cyan: #00f0ff;
        }
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Rajdhani',sans-serif; }
        body { background-color:var(--bg-black); color:#fff; overflow-x:hidden; min-height:100vh; display:flex; flex-direction:column; }
        
        /* Background */
        #space-bg { position:fixed; top:0; left:0; width:100vw; height:100vh; z-index:-1; background:radial-gradient(circle at center, #1a0b2e 0%, var(--bg-black) 80%); }
        
        /* Header */
        header { text-align:center; padding:40px 20px; position:relative; z-index:10; }
        .title { font-family:'Orbitron',sans-serif; font-size:clamp(2rem, 5vw, 4rem); font-weight:900; color:var(--cyan); text-shadow:0 0 20px rgba(0,240,255,0.6); letter-spacing:4px; text-transform:uppercase; animation:glowPulse 2s infinite alternate; }
        .subtitle { font-family:'Orbitron',sans-serif; font-size:1.2rem; color:var(--crimson); letter-spacing:6px; margin-top:10px; text-transform:uppercase; }
        
        @keyframes glowPulse { 0% { text-shadow:0 0 10px rgba(0,240,255,0.4); } 100% { text-shadow:0 0 30px rgba(0,240,255,0.8), 0 0 50px rgba(0,240,255,0.4); } }
        
        /* Podium Container */
        .podium-container { display:flex; flex-direction:column; align-items:center; justify-content:center; flex-grow:1; padding:20px; gap:40px; position:relative; z-index:10; max-width:1200px; margin:0 auto; width:100%; }
        
        @media(min-width: 768px) {
            .podium-container { flex-direction:row; align-items:flex-end; gap:30px; height:60vh; }
        }

        /* Podium Cards */
        .podium-card { 
            background: rgba(18, 16, 24, 0.85); 
            border: 2px solid; 
            border-radius: 16px; 
            padding: 30px 20px; 
            text-align: center; 
            width: 100%; 
            max-width: 320px;
            backdrop-filter: blur(10px);
            transition: transform 0.4s ease, box-shadow 0.4s ease;
            animation: floatUp 0.6s ease-out both;
            position:relative;
        }

        .podium-card::before {
            content:''; position:absolute; inset:0; background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,0.1) 3px,rgba(0,0,0,0.1) 4px); pointer-events:none; border-radius:14px;
        }

        /* 1st Place */
        .rank-1 { border-color: var(--gold); box-shadow: 0 0 40px rgba(255,215,0,0.3), inset 0 0 20px rgba(255,215,0,0.1); z-index:3; order: 1; }
        @media(min-width: 768px) { .rank-1 { transform: translateY(-40px); order: 2; max-width: 380px; padding: 40px 20px; } }
        .rank-1 .icon { color: var(--gold); font-size: 5rem; text-shadow: 0 0 30px rgba(255,215,0,0.8); animation: trophyFloat 3s ease-in-out infinite; }
        .rank-1 .team-name { color: var(--gold); font-size: 2.2rem; }
        .rank-1 .score-box { background: rgba(255,215,0,0.15); border-color: rgba(255,215,0,0.5); }

        /* 2nd Place */
        .rank-2 { border-color: var(--silver); box-shadow: 0 0 30px rgba(192,192,192,0.2), inset 0 0 15px rgba(192,192,192,0.1); z-index:2; order: 2; }
        @media(min-width: 768px) { .rank-2 { order: 1; transform: translateY(20px); } }
        .rank-2 .icon { color: var(--silver); font-size: 3.5rem; text-shadow: 0 0 20px rgba(192,192,192,0.6); }
        .rank-2 .team-name { color: var(--silver); font-size: 1.8rem; }
        .rank-2 .score-box { background: rgba(192,192,192,0.1); border-color: rgba(192,192,192,0.4); }

        /* 3rd Place */
        .rank-3 { border-color: var(--bronze); box-shadow: 0 0 30px rgba(205,127,50,0.2), inset 0 0 15px rgba(205,127,50,0.1); z-index:1; order: 3; }
        @media(min-width: 768px) { .rank-3 { order: 3; transform: translateY(40px); } }
        .rank-3 .icon { color: var(--bronze); font-size: 3.5rem; text-shadow: 0 0 20px rgba(205,127,50,0.6); }
        .rank-3 .team-name { color: var(--bronze); font-size: 1.8rem; }
        .rank-3 .score-box { background: rgba(205,127,50,0.1); border-color: rgba(205,127,50,0.4); }

        /* Common card styles */
        .icon { line-height:1; margin-bottom:15px; position:relative; z-index:2; }
        .rank-label { font-family:'Orbitron',sans-serif; font-weight:900; letter-spacing:2px; font-size:0.9rem; text-transform:uppercase; margin-bottom:5px; opacity:0.8; position:relative; z-index:2; }
        .team-name { font-family:'Orbitron',sans-serif; font-weight:900; letter-spacing:2px; text-transform:uppercase; margin-bottom:20px; line-height:1.2; word-break:break-word; position:relative; z-index:2; }
        
        .score-box { 
            border: 1px solid; 
            border-radius: 8px; 
            padding: 15px; 
            display:inline-block;
            min-width: 150px;
            position:relative; z-index:2;
        }
        .score-label { font-size: 0.8rem; text-transform:uppercase; letter-spacing:2px; margin-bottom:5px; opacity:0.7; }
        .score-value { font-family:'Orbitron',sans-serif; font-size: 2rem; font-weight:900; letter-spacing:2px; }
        .rank-1 .score-value { font-size: 2.5rem; }

        /* Loading / Empty states */
        #loading-message { font-family:'Orbitron',sans-serif; font-size:1.5rem; color:var(--cyan); text-transform:uppercase; letter-spacing:4px; animation:glowPulse 1s infinite alternate; }
        
        @keyframes floatUp { from { opacity: 0; transform: translateY(50px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes trophyFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    </style>
</head>
<body>
    <canvas id="space-bg"></canvas>

    <header>
        <div class="title">LIVE PODIUM</div>
        <div class="subtitle">ASTRA 11.0 | THE IMPOSTER PROJECT</div>
    </header>

    <div class="podium-container" id="podium-container">
        <div id="loading-message">Connecting to Mainframe...</div>
    </div>

    <script>
        var API_BASE = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' || window.location.hostname === '')
            ? 'http://localhost:3000'
            : '';

        // Space Canvas Animation
        var canvas = document.getElementById('space-bg');
        var ctx = canvas.getContext('2d');
        function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
        var stars = [];
        var starColors = ['#ffffff', '#00f0ff', '#ff1e43', '#ffd700'];
        for (var i = 0; i < 150; i++) {
            stars.push({ x: Math.random()*canvas.width, y: Math.random()*canvas.height, radius: Math.random()*1.8, color: starColors[Math.floor(Math.random()*starColors.length)], speed: Math.random()*0.5+0.1 });
        }
        function animateSpace() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            stars.forEach(function(s) {
                ctx.beginPath(); ctx.arc(s.x, s.y, s.radius, 0, Math.PI*2); ctx.fillStyle = s.color; ctx.fill();
                s.y += s.speed;
                if (s.y > canvas.height) { s.y = 0; s.x = Math.random()*canvas.width; }
            });
            requestAnimationFrame(animateSpace);
        }
        animateSpace();

        // Podium Logic
        let previousFirstPlace = null;

        async function fetchPodium() {
            try {
                const response = await fetch(API_BASE + '/api/podium');
                const data = await response.json();
                
                if (data.success && data.podium) {
                    renderPodium(data.podium);
                }
            } catch (err) {
                console.error("Error fetching live podium:", err);
            }
        }

        function renderPodium(teams) {
            const container = document.getElementById('podium-container');
            
            // Get top 3 only
            const top3 = teams.slice(0, 3);
            
            if (top3.length === 0) {
                container.innerHTML = '<div id="loading-message">No scores available yet.</div>';
                return;
            }

            // Check if first place changed for potential effects
            if (top3[0] && previousFirstPlace !== top3[0].team) {
                previousFirstPlace = top3[0].team;
            }

            let html = '';
            
            // Map data to medals/ranks
            const ranks = [
                { class: 'rank-1', icon: '🏆', label: '1ST PLACE' },
                { class: 'rank-2', icon: '🥈', label: '2ND PLACE' },
                { class: 'rank-3', icon: '🥉', label: '3RD PLACE' }
            ];

            top3.forEach((team, index) => {
                const rankDef = ranks[index];
                
                html += `
                    <div class="podium-card ${rankDef.class}" style="animation-delay: ${index * 0.2}s">
                        <div class="icon">${rankDef.icon}</div>
                        <div class="rank-label">${rankDef.label}</div>
                        <div class="team-name">${team.team}</div>
                        <div class="score-box">
                            <div class="score-label">Grand Total</div>
                            <div class="score-value">${team.grand_total}</div>
                        </div>
                    </div>
                `;
            });

            // Prevent harsh repainting if HTML is identical (stops animations from re-triggering constantly)
            if (container.innerHTML !== html) {
                container.innerHTML = html;
            }
        }

        // Initial fetch and 5-second polling
        fetchPodium();
        setInterval(fetchPodium, 5000);
    </script>
</body>
</html>
