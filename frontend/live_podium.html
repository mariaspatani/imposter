<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIVE PODIUM | ASTRA 11.0</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050308;
            --gold: #ffd700;
            --silver: #c0c0c0;
            --bronze: #cd7f32;
            --cyan: #00f0ff;
            --crimson: #ff1e43;
            --purple: #8b00ff;
        }

        * { margin:0; padding:0; box-sizing:border-box; }
        body { 
            background: var(--bg); 
            color: #fff; 
            font-family: 'Rajdhani', sans-serif; 
            overflow: hidden; /* Hide scrollbars for cinematic view */
            height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* ── BACKGROUND ── */
        .bg-layer { position: absolute; inset: 0; pointer-events: none; }
        
        #nebula {
            background: radial-gradient(circle at 50% 40%, rgba(139,0,255,0.15) 0%, rgba(0,240,255,0.05) 40%, var(--bg) 80%);
            z-index: 1;
        }
        
        .scanlines {
            background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.1) 50%, rgba(0,0,0,0.1));
            background-size: 100% 4px;
            z-index: 10;
            opacity: 0.3;
        }

        .grid-floor {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 30vh;
            background: 
                linear-gradient(transparent 0%, rgba(0, 240, 255, 0.4) 2%, transparent 3%),
                linear-gradient(90deg, transparent 0%, rgba(0, 240, 255, 0.4) 2%, transparent 3%);
            background-size: 50px 50px;
            transform: perspective(500px) rotateX(60deg);
            transform-origin: bottom;
            z-index: 2;
            animation: gridMove 20s linear infinite;
            opacity: 0.4;
            border-top: 2px solid var(--cyan);
            box-shadow: 0 -10px 30px rgba(0,240,255,0.2);
        }
        @keyframes gridMove { from { background-position: 0 0; } to { background-position: 0 500px; } }

        canvas#particle-canvas { position: absolute; inset: 0; z-index: 3; }

        /* ── TOP BAR ── */
        .top-bar {
            position: absolute; top: 0; left: 0; width: 100%; padding: 20px 40px;
            display: flex; justify-content: space-between; align-items: flex-start;
            z-index: 20;
            font-family: 'Orbitron', sans-serif;
        }
        .clock {
            color: var(--cyan); text-shadow: 0 0 10px rgba(0,240,255,0.5);
            font-size: 1.2rem; font-weight: 700; line-height: 1.4;
        }
        .live-status {
            display: flex; align-items: center; gap: 10px;
            color: var(--crimson); font-weight: 900; font-size: 1.5rem;
            text-shadow: 0 0 15px rgba(255,30,67,0.8);
            letter-spacing: 2px;
        }
        .live-status .dot {
            width: 12px; height: 12px; background: var(--crimson); border-radius: 50%;
            animation: pulse 1s infinite alternate;
        }
        .update-text { font-family: 'Rajdhani', sans-serif; font-size: 0.9rem; color: #aaa; text-shadow: none; font-weight: 600; letter-spacing: 1px; }

        /* ── HEADER ── */
        header { text-align: center; margin-top: 5vh; position: relative; z-index: 20; }
        .title-glitch {
            font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: clamp(3rem, 6vw, 6rem);
            color: #fff; text-shadow: 0 0 20px var(--cyan), 0 0 40px var(--cyan);
            letter-spacing: 8px; position: relative; display: inline-block;
            animation: textGlow 2s infinite alternate;
        }
        .title-glitch::before, .title-glitch::after {
            content: attr(data-text); position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0.8; z-index: -1;
        }
        .title-glitch::before { color: var(--cyan); z-index: -1; animation: glitch-anim 3s infinite linear alternate-reverse; }
        .title-glitch::after { color: var(--crimson); z-index: -2; animation: glitch-anim 2.5s infinite linear alternate-reverse; }
        
        .scan-light {
            position: absolute; top: 0; left: -100%; width: 50px; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.8), transparent);
            transform: skewX(-20deg);
            animation: scanLight 4s infinite cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .subtitle {
            font-family: 'Rajdhani', sans-serif; font-size: 1.5rem; font-weight: 700;
            color: #aaa; letter-spacing: 10px; margin-top: -10px; text-transform: uppercase;
        }

        /* ── GRAND PODIUM ── */
        .podium-area {
            flex-grow: 1; display: flex; justify-content: center; align-items: flex-end;
            padding-bottom: 8vh; z-index: 20; position: relative; gap: 20px;
        }

        .podium-card {
            display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
            position: relative; transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .card-inner {
            background: rgba(10, 10, 15, 0.8); backdrop-filter: blur(10px);
            border: 2px solid; border-radius: 12px;
            padding: 20px; text-align: center; width: 280px;
            position: relative; z-index: 2;
            display: flex; flex-direction: column; align-items: center;
        }

        .platform {
            width: 300px; border-radius: 8px 8px 0 0;
            margin-top: 15px; position: relative; z-index: 1;
            box-shadow: inset 0 10px 30px rgba(255,255,255,0.1);
        }

        /* Rank 1 */
        .rank-1 { order: 2; z-index: 3; }
        .rank-1 .card-inner { border-color: var(--gold); box-shadow: 0 0 30px rgba(255,215,0,0.3); transform: scale(1.15); margin-bottom: 20px; }
        .rank-1 .platform { height: 25vh; background: linear-gradient(to bottom, rgba(255,215,0,0.4), rgba(255,215,0,0.05)); border-top: 4px solid var(--gold); }
        .spotlight {
            position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
            width: 600px; height: 100vh; pointer-events: none;
            background: radial-gradient(ellipse at bottom, rgba(255,215,0,0.15) 0%, transparent 60%);
            z-index: 0;
        }
        .trophy-container { position: absolute; top: -140px; left: 50%; transform: translateX(-50%); z-index: 10; }
        .trophy { font-size: 6rem; filter: drop-shadow(0 0 20px var(--gold)); animation: trophySpin 4s infinite linear; }

        /* Rank 2 */
        .rank-2 { order: 1; z-index: 2; }
        .rank-2 .card-inner { border-color: var(--silver); box-shadow: 0 0 20px rgba(192,192,192,0.2); }
        .rank-2 .platform { height: 15vh; background: linear-gradient(to bottom, rgba(192,192,192,0.3), rgba(192,192,192,0.05)); border-top: 4px solid var(--silver); }

        /* Rank 3 */
        .rank-3 { order: 3; z-index: 1; }
        .rank-3 .card-inner { border-color: var(--bronze); box-shadow: 0 0 20px rgba(205,127,50,0.2); }
        .rank-3 .platform { height: 8vh; background: linear-gradient(to bottom, rgba(205,127,50,0.3), rgba(205,127,50,0.05)); border-top: 4px solid var(--bronze); }

        /* Card Content */
        .medal { font-size: 2.5rem; line-height: 1; margin-bottom: 5px; filter: drop-shadow(0 0 10px rgba(255,255,255,0.3)); }
        .rank-1 .medal { font-size: 3.5rem; }
        .rank-title { font-family: 'Orbitron', sans-serif; font-size: 0.8rem; letter-spacing: 3px; color: #aaa; margin-bottom: 10px; }
        .team-name { font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 1.8rem; text-transform: uppercase; word-break: break-word; min-height: 65px; display: flex; align-items: center; justify-content: center; }
        .rank-1 .team-name { color: var(--gold); font-size: 2.2rem; text-shadow: 0 0 15px rgba(255,215,0,0.5); }
        .rank-2 .team-name { color: var(--silver); text-shadow: 0 0 15px rgba(192,192,192,0.5); }
        .rank-3 .team-name { color: var(--bronze); text-shadow: 0 0 15px rgba(205,127,50,0.5); }
        
        .score { font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 3rem; margin-top: 10px; }
        .rank-1 .score { color: var(--gold); font-size: 4rem; }

        .flash { animation: flashHighlight 1s ease-out; }

        /* ── BOTTOM MARQUEE ── */
        .marquee-container {
            position: absolute; bottom: 0; left: 0; width: 100%;
            background: rgba(0,0,0,0.8); border-top: 1px solid var(--cyan);
            padding: 10px 0; z-index: 30; overflow: hidden; white-space: nowrap;
            box-shadow: 0 -5px 20px rgba(0,240,255,0.2);
        }
        .marquee {
            display: inline-block; font-family: 'Orbitron', sans-serif; font-size: 1.2rem;
            color: var(--cyan); letter-spacing: 2px;
            animation: scrollMarquee 20s linear infinite;
        }

        /* ── ANIMATIONS ── */
        @keyframes pulse { 0% { opacity: 0.4; box-shadow: 0 0 0 0 rgba(255,30,67,0.7); } 100% { opacity: 1; box-shadow: 0 0 0 10px rgba(255,30,67,0); } }
        @keyframes textGlow { 0% { text-shadow: 0 0 10px var(--cyan); } 100% { text-shadow: 0 0 30px var(--cyan), 0 0 50px rgba(0,240,255,0.5); } }
        @keyframes scanLight { 0% { left: -100%; } 20% { left: 200%; } 100% { left: 200%; } }
        @keyframes scrollMarquee { 0% { transform: translateX(100vw); } 100% { transform: translateX(-100%); } }
        @keyframes trophySpin { 0% { transform: translateY(0) rotateY(0deg); } 50% { transform: translateY(-15px) rotateY(180deg); } 100% { transform: translateY(0) rotateY(360deg); } }
        @keyframes flashHighlight { 0% { transform: scale(1); filter: brightness(1); } 50% { transform: scale(1.1); filter: brightness(2); } 100% { transform: scale(1); filter: brightness(1); } }
        
        @keyframes glitch-anim {
            0% { clip-path: inset(10% 0 30% 0); transform: translate(-2px, 2px); }
            20% { clip-path: inset(80% 0 5% 0); transform: translate(2px, -2px); }
            40% { clip-path: inset(40% 0 50% 0); transform: translate(-2px, -2px); }
            60% { clip-path: inset(15% 0 70% 0); transform: translate(2px, 2px); }
            80% { clip-path: inset(60% 0 10% 0); transform: translate(-2px, -2px); }
            100% { clip-path: inset(30% 0 40% 0); transform: translate(2px, 2px); }
        }

        /* Responsive */
        @media (max-width: 900px) {
            .podium-area { flex-direction: column; align-items: center; justify-content: flex-start; gap: 20px; overflow-y: auto; padding-top: 20px; padding-bottom: 60px; height: 60vh; }
            .rank-1, .rank-2, .rank-3 { order: unset !important; }
            .platform { display: none; } /* Hide 3D platform on mobile */
            .rank-1 .card-inner { transform: scale(1); margin-bottom: 0; }
            .trophy-container { top: -80px; }
            .trophy { font-size: 4rem; }
            .title-glitch { font-size: 3rem; }
            header { margin-top: 10vh; }
        }
    </style>
</head>
<body>
    <div class="bg-layer" id="nebula"></div>
    <div class="bg-layer scanlines"></div>
    <div class="grid-floor"></div>
    <canvas id="particle-canvas"></canvas>

    <div class="top-bar">
        <div class="clock" id="clock">--<br>--</div>
        <div class="live-status"><span class="dot"></span> LIVE <span class="update-text">Updates every 5s</span></div>
    </div>

    <header>
        <div class="title-glitch" data-text="LIVE PODIUM">LIVE PODIUM<div class="scan-light"></div></div>
        <div class="subtitle">ASTRA 11.0 • THE IMPOSTER PROJECT</div>
    </header>

    <main class="podium-area">
        <!-- Rank 2 -->
        <div class="podium-card rank-2" id="card-2">
            <div class="card-inner">
                <div class="medal">🥈</div>
                <div class="rank-title">2ND PLACE</div>
                <div class="team-name" id="name-2">--</div>
                <div class="score" id="score-2">0</div>
            </div>
            <div class="platform"></div>
        </div>

        <!-- Rank 1 -->
        <div class="podium-card rank-1" id="card-1">
            <div class="spotlight"></div>
            <div class="trophy-container"><div class="trophy">🏆</div></div>
            <div class="card-inner">
                <div class="medal">🥇</div>
                <div class="rank-title">1ST PLACE</div>
                <div class="team-name" id="name-1">--</div>
                <div class="score" id="score-1">0</div>
            </div>
            <div class="platform"></div>
        </div>

        <!-- Rank 3 -->
        <div class="podium-card rank-3" id="card-3">
            <div class="card-inner">
                <div class="medal">🥉</div>
                <div class="rank-title">3RD PLACE</div>
                <div class="team-name" id="name-3">--</div>
                <div class="score" id="score-3">0</div>
            </div>
            <div class="platform"></div>
        </div>
    </main>

    <div class="marquee-container">
        <div class="marquee" id="marquee-content">
            🏆 ASTRA 11.0 LIVE • SOFTWARE COMPUTING LAB • THE IMPOSTER PROJECT 🏆 Awaiting Scores...
        </div>
    </div>

    <script>
        var API_BASE = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' || window.location.hostname === '')
            ? 'http://localhost:3000'
            : '';

        // ── Digital Clock ──
        function updateClock() {
            const now = new Date();
            const dateOpts = { day: '2-digit', month: 'long', year: 'numeric' };
            const timeOpts = { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true };
            
            const dateStr = now.toLocaleDateString('en-GB', dateOpts).toUpperCase();
            const timeStr = now.toLocaleTimeString('en-US', timeOpts).toUpperCase();
            
            document.getElementById('clock').innerHTML = dateStr + '<br>' + timeStr;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // ── Particle Background ──
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        
        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resize); resize();

        for (let i = 0; i < 100; i++) {
            particles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 2 + 1,
                speedY: Math.random() * -0.5 - 0.1,
                color: Math.random() > 0.5 ? 'rgba(0, 240, 255, 0.6)' : 'rgba(255, 30, 67, 0.6)' // cyan or red
            });
        }
        for (let i = 0; i < 150; i++) {
            particles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 1.5,
                speedY: 0,
                color: 'rgba(255, 255, 255, 0.8)' // stars
            });
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
                
                if (p.speedY !== 0) { // floating dust
                    p.y += p.speedY;
                    if (p.y < 0) p.y = canvas.height;
                } else { // twinkling stars
                    if (Math.random() < 0.01) p.size = Math.random() * 2;
                }
            });
            requestAnimationFrame(animateParticles);
        }
        animateParticles();

        // ── Data Fetching & Animation ──
        let currentData = { 1: { team: '', score: -1 }, 2: { team: '', score: -1 }, 3: { team: '', score: -1 } };

        function animateValue(obj, start, end, duration) {
            let startTimestamp = null;
            const step = (timestamp) => {
                if (!startTimestamp) startTimestamp = timestamp;
                const progress = Math.min((timestamp - startTimestamp) / duration, 1);
                obj.innerHTML = Math.floor(progress * (end - start) + start);
                if (progress < 1) {
                    window.requestAnimationFrame(step);
                } else {
                    obj.innerHTML = end;
                }
            };
            window.requestAnimationFrame(step);
        }

        async function fetchPodium() {
            try {
                const response = await fetch(API_BASE + '/api/podium');
                const data = await response.json();
                
                if (data.success && data.podium) {
                    updatePodium(data.podium);
                }
            } catch (err) {
                console.error("Live Podium Error:", err);
            }
        }

        function updatePodium(teams) {
            const top3 = teams.slice(0, 3);
            
            top3.forEach((team, index) => {
                const rank = index + 1;
                const nameEl = document.getElementById('name-' + rank);
                const scoreEl = document.getElementById('score-' + rank);
                const cardEl = document.getElementById('card-' + rank);
                
                if (!nameEl || !scoreEl) return;

                const newTeam = team.team;
                const newScore = team.grand_total;
                const oldData = currentData[rank];

                if (oldData.team !== newTeam) {
                    // Team changed position!
                    nameEl.innerText = newTeam;
                    cardEl.classList.remove('flash');
                    void cardEl.offsetWidth; // trigger reflow
                    cardEl.classList.add('flash');
                }

                if (oldData.score !== newScore) {
                    // Score changed
                    const startScore = oldData.score === -1 ? 0 : oldData.score;
                    animateValue(scoreEl, startScore, newScore, 1000);
                }

                currentData[rank] = { team: newTeam, score: newScore };
            });

            // Update Marquee
            if (top3.length > 0) {
                let marqueeStr = '🏆 ASTRA 11.0 LIVE • SOFTWARE COMPUTING LAB • THE IMPOSTER PROJECT • ';
                teams.slice(0, 10).forEach((t, i) => {
                    marqueeStr += `${i+1}. ${t.team} (${t.grand_total} Pts) • `;
                });
                document.getElementById('marquee-content').innerText = marqueeStr;
            }
        }

        fetchPodium();
        setInterval(fetchPodium, 5000);

    </script>
</body>
</html>
