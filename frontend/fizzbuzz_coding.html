<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FIZZBUZZ CODING | Astra 11.0</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@500;600;700&family=Fira+Code:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root { --bg-black:#08070b; --dark-grey:#16151d; --cherry-red:#c00d2e; --crimson-red:#ff1e43; --violet:#6b21a8; --deep-blue:#0d1b2a; --cyan-accent:#00f0ff; --green-accent:#00ff66; --text-light:#f3f4f6; }
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Rajdhani',sans-serif; }
        body { background-color:var(--bg-black); color:var(--text-light); min-height:100vh; overflow-x:hidden; }
        #space-bg { position:fixed; top:0; left:0; width:100vw; height:100vh; z-index:-1; background:radial-gradient(circle at center,#1a0b2e 0%,var(--bg-black) 80%); }
        header { display:flex; justify-content:space-between; align-items:center; padding:15px 5%; background:rgba(8,7,11,0.85); backdrop-filter:blur(10px); border-bottom:2px solid var(--cherry-red); position:sticky; top:0; z-index:100; }
        .org-branding { font-family:'Orbitron',sans-serif; font-size:0.9rem; color:#aaa; letter-spacing:1px; }
        .org-branding span { color:var(--crimson-red); font-weight:bold; }
        .container { max-width:860px; margin:30px auto; padding:20px; display:flex; flex-direction:column; gap:22px; }
        /* Timer */
        .timer-box { display:flex; align-items:center; justify-content:space-between; background:rgba(13,27,42,0.9); border:2px solid var(--cyan-accent); border-radius:8px; padding:15px 25px; box-shadow:0 0 12px rgba(0,240,255,0.3); }
        .timer-label { font-family:'Orbitron',sans-serif; font-size:1rem; color:#aaa; letter-spacing:2px; display:flex; align-items:center; gap:10px; }
        .live-dot { width:12px; height:12px; background-color:var(--green-accent); border-radius:50%; box-shadow:0 0 10px var(--green-accent); animation:pg 0.8s infinite alternate; }
        @keyframes pg { from{opacity:0.3;transform:scale(0.9)} to{opacity:1;transform:scale(1.1)} }
        .timer-display { font-family:'Orbitron',sans-serif; font-size:2.4rem; font-weight:900; color:var(--green-accent); text-shadow:0 0 12px rgba(0,255,102,0.7); letter-spacing:3px; }
        .timer-display.expired { color:var(--crimson-red); text-shadow:0 0 12px rgba(255,30,67,0.7); }
        /* Info card */
        .info-card { background:rgba(22,21,29,0.85); border:2px solid var(--violet); border-radius:12px; padding:20px 24px; position:relative; overflow:hidden; }
        .info-card::before { content:''; position:absolute; top:0; left:0; width:100%; height:4px; background:linear-gradient(90deg,var(--cherry-red),var(--violet),var(--deep-blue)); }
        .info-row { display:flex; gap:28px; flex-wrap:wrap; }
        .info-item { display:flex; flex-direction:column; gap:3px; }
        .info-label { font-size:0.65rem; letter-spacing:2px; text-transform:uppercase; color:#9db5d3; }
        .info-value { font-size:1rem; font-weight:bold; color:var(--cyan-accent); letter-spacing:1px; }
        /* Form panel */
        .panel { background:rgba(22,21,29,0.85); border:2px solid var(--violet); border-radius:12px; padding:22px 24px; position:relative; overflow:hidden; }
        .panel::before { content:''; position:absolute; top:0; left:0; width:100%; height:4px; background:linear-gradient(90deg,var(--cherry-red),var(--violet),var(--deep-blue)); }
        .panel-title { font-family:'Orbitron',sans-serif; font-size:1rem; color:var(--cyan-accent); letter-spacing:2px; text-transform:uppercase; margin-bottom:16px; }
        .input-label { font-family:'Orbitron',sans-serif; font-size:0.85rem; color:var(--cyan-accent); letter-spacing:1px; display:block; margin-bottom:8px; }
        .lang-select { width:100%; padding:12px 14px; background:rgba(8,7,11,0.95); border:2px solid var(--violet); border-radius:8px; color:var(--text-light); font-family:'Orbitron',sans-serif; font-size:0.9rem; outline:none; cursor:pointer; margin-bottom:18px; transition:border-color 0.2s; }
        .lang-select:focus { border-color:var(--cyan-accent); }
        .code-area { width:100%; height:340px; background:rgba(8,7,11,0.95); border:2px solid var(--violet); border-radius:8px; padding:16px; color:var(--green-accent); font-family:'Fira Code',monospace; font-size:0.95rem; line-height:1.6; resize:vertical; outline:none; transition:border-color 0.2s,box-shadow 0.2s; }
        .code-area:focus { border-color:var(--cyan-accent); box-shadow:0 0 12px rgba(0,240,255,0.3); }
        .code-area:disabled { opacity:0.45; cursor:not-allowed; }
        .submit-btn { width:100%; margin-top:16px; padding:16px; background:linear-gradient(135deg,#c00d2e,var(--crimson-red)); color:#fff; font-family:'Orbitron',sans-serif; font-size:1.05rem; font-weight:800; border:2px solid #000; border-radius:50px; cursor:pointer; letter-spacing:2px; box-shadow:0 0 15px rgba(255,30,67,0.5); transition:all 0.2s; }
        .submit-btn:hover:not(:disabled) { transform:scale(1.02); box-shadow:0 0 28px rgba(255,30,67,0.8); }
        .submit-btn:disabled { opacity:0.5; cursor:not-allowed; }
        /* Status */
        .status-msg { display:none; margin-top:18px; padding:18px; background:rgba(0,255,102,0.1); border:2px solid var(--green-accent); border-radius:8px; color:var(--green-accent); font-family:'Orbitron',sans-serif; text-align:center; font-size:1rem; line-height:1.6; }
        .status-msg.error { background:rgba(255,30,67,0.1); border-color:var(--crimson-red); color:#ffbfd0; }
        .locked-msg { padding:18px; background:rgba(0,240,255,0.06); border:1px solid rgba(0,240,255,0.3); border-radius:8px; color:var(--cyan-accent); font-family:'Orbitron',sans-serif; text-align:center; font-size:0.9rem; letter-spacing:1px; }
        .waiting-box { padding:22px; background:rgba(22,21,29,0.85); border:2px solid var(--violet); border-radius:12px; text-align:center; }
        .waiting-box .wt { font-family:'Orbitron',sans-serif; font-size:1.1rem; color:var(--cyan-accent); letter-spacing:2px; }
        .waiting-box .ws { font-size:0.9rem; color:#9db5d3; margin-top:8px; }
    </style>
</head>
<body>
    <canvas id="space-bg"></canvas>
    <header>
        <div class="org-branding">ST. JOSEPH'S COLLEGE OF ENG. &amp; TECH. | <span>ASTRA 11.0</span></div>
        <div class="org-branding">FIZZBUZZ SUBMISSION</div>
    </header>

    <div class="container">
        <!-- Event status (replaces timer) -->
        <div class="timer-box">
            <span class="timer-label"><span class="live-dot" id="live-dot"></span>&nbsp;FIZZBUZZ STATUS:</span>
            <span class="timer-display" id="event-status-badge" style="font-size:1.2rem;letter-spacing:2px;">CHECKING...</span>
        </div>

        <!-- Expired state -->
        <div id="state-expired" class="waiting-box" style="display:none;">
            <div class="wt" style="color:var(--crimson-red);">&#9201; FizzBuzz Round Ended</div>
            <div class="ws">Time is up. Submissions are now closed.</div>
        </div>

        <!-- Participant info -->
        <div class="info-card" id="info-card" style="display:none;">
            <div class="info-row">
                <div class="info-item"><span class="info-label">Participant</span><span class="info-value" id="info-name">--</span></div>
                <div class="info-item"><span class="info-label">Original Team</span><span class="info-value" id="info-team">--</span></div>
                <div class="info-item"><span class="info-label">Shuffled Group</span><span class="info-value" id="info-group">--</span></div>
            </div>
        </div>

        <!-- Submission form -->
        <div class="panel" id="form-panel" style="display:none;">
            <!-- Already submitted notice -->
            <div id="locked-notice" class="locked-msg" style="display:none; margin-bottom:16px;">
                &#128274; Your group has already submitted. Waiting for results.
            </div>

            <form id="fizzbuzz-form" onsubmit="submitCode(event)">
                <label class="input-label">PROGRAMMING LANGUAGE</label>
                <select id="lang-select" class="lang-select">
                    <option value="C">C</option>
                    <option value="C++">C++</option>
                    <option value="Java">Java</option>
                    <option value="Python" selected>Python</option>
                    <option value="JavaScript">JavaScript</option>
                </select>

                <label class="input-label" for="code-area">YOUR FIZZBUZZ SOLUTION</label>
                <textarea id="code-area" class="code-area" placeholder="Paste your FizzBuzz solution here..." required></textarea>

                <button type="submit" id="submit-btn" class="submit-btn">SUBMIT SOLUTION</button>
            </form>

            <div id="status-msg" class="status-msg"></div>
        </div>
    </div>

    <script>
        var API_BASE = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' || window.location.hostname === '')
            ? 'http://localhost:3000' : '';

        var PARTICIPANT_ID = localStorage.getItem('participant_id') || sessionStorage.getItem('participant_id');
        if (!PARTICIPANT_ID) {
            var _s = sessionStorage.getItem('imposterParticipant') || localStorage.getItem('imposterParticipant');
            var _p = _s ? (function(){try{return JSON.parse(_s);}catch(e){return null;}})() : null;
            PARTICIPANT_ID = _p && _p.id ? String(_p.id) : null;
        }
        if (!PARTICIPANT_ID) { window.location.href = 'homepage.html'; }

        var PARTICIPANT_NAME = localStorage.getItem('participant_name') || '';
        var ORIGINAL_TEAM    = localStorage.getItem('imposterTeamName') || '';
        var statusPoll       = null;   // polls /api/fizzbuzz/toggle for close
        var lockPollInterval = null;   // polls for group submission by another member

        // ── Restore cached participant info so reload shows names instantly ──
        (function restoreCachedInfo(){
            var cached = localStorage.getItem('fizzbuzz_participant_cache');
            if (!cached) return;
            try {
                var c = JSON.parse(cached);
                if (c.id !== PARTICIPANT_ID) return; // stale cache for different user
                var nameEl  = document.getElementById('info-name');
                var teamEl  = document.getElementById('info-team');
                var groupEl = document.getElementById('info-group');
                if (nameEl  && c.name)  nameEl.innerText  = c.name;
                if (teamEl  && c.team)  teamEl.innerText  = c.team;
                if (groupEl && c.group) groupEl.innerText = c.group;
                // Show cards while data loads in background
                document.getElementById('info-card').style.display  = 'block';
                document.getElementById('form-panel').style.display = 'block';
                // Restore submitted state if was already submitted
                if (c.submitted && c.submittedBy) {
                    var locked = document.getElementById('locked-notice');
                    locked.innerHTML = '🔒 <strong>SUBMITTED</strong>'
                        + '<br>Submitted by: ' + escHtml(c.submittedBy)
                        + (c.submittedAt ? '<br>Time: ' + new Date(c.submittedAt).toLocaleTimeString() : '')
                        + '<br><span style="font-size:0.8rem;color:#9db5d3;">Waiting for coordinator scoring.</span>';
                    locked.style.display = 'block';
                    document.getElementById('fizzbuzz-form').style.display = 'none';
                }
            } catch(e) {}
        })();

        // ── Space background ──────────────────────────────────────────────────
        var cv=document.getElementById('space-bg'),cx=cv.getContext('2d');
        function rC(){cv.width=window.innerWidth;cv.height=window.innerHeight;}rC();window.addEventListener('resize',rC);
        var st=[];for(var i=0;i<150;i++)st.push({x:Math.random()*cv.width,y:Math.random()*cv.height,r:Math.random()*1.8,c:['#fff','#ff1e43','#00f0ff','#6b21a8'][Math.floor(Math.random()*4)],s:Math.random()*0.5+0.1});
        (function a(){cx.clearRect(0,0,cv.width,cv.height);st.forEach(function(s){cx.beginPath();cx.arc(s.x,s.y,s.r,0,Math.PI*2);cx.fillStyle=s.c;cx.fill();s.y+=s.s;if(s.y>cv.height){s.y=0;s.x=Math.random()*cv.width;}});requestAnimationFrame(a);})();

        // ── Status helpers ────────────────────────────────────────────────────
        function setStatusBadge(text, color){
            var badge = document.getElementById('event-status-badge');
            if(!badge) return;
            badge.textContent = text;
            badge.style.color = color;
        }

        function closedState(){
            clearInterval(statusPoll); clearInterval(lockPollInterval);
            setStatusBadge('● CLOSED', 'var(--crimson-red)');
            document.getElementById('state-expired').style.display = 'block';
            document.getElementById('form-panel').style.display    = 'none';
            var dot = document.getElementById('live-dot');
            if(dot){ dot.style.animation='none'; dot.style.backgroundColor='#c00d2e'; dot.style.boxShadow='none'; }
        }

        function waitingState(){
            setStatusBadge('● WAITING', '#9db5d3');
            document.getElementById('state-expired').style.display = 'none';
            var locked = document.getElementById('locked-notice');
            if(locked){ locked.innerText='⏳ Waiting for coordinator to start FizzBuzz...'; locked.style.display='block'; }
            document.getElementById('fizzbuzz-form').style.display = 'none';
        }

        // ── Event status poll (every 5s once loaded) ─────────────────────────
        function startStatusPoll(){
            clearInterval(statusPoll);
            statusPoll = setInterval(async function(){
                try {
                    var r = await fetch(API_BASE+'/api/fizzbuzz/toggle');
                    if(!r.ok) return;
                    var d = await r.json();
                    if(d.status === 'closed') closedState();
                } catch(e){}
            }, 5000);
        }

        // ── Load page ─────────────────────────────────────────────────────────
        async function loadPage(){
            // 1. Check event status
            try {
                var tr = await fetch(API_BASE+'/api/fizzbuzz/toggle');
                var td = tr.ok ? await tr.json() : { success:false, status:'waiting' };

                if(td.status === 'closed'){
                    // Show info card (so participant sees their name) then closed state
                    document.getElementById('info-card').style.display = 'block';
                    setStatusBadge('● CLOSED', 'var(--crimson-red)');
                    document.getElementById('state-expired').style.display = 'block';
                    loadParticipantInfo(false);
                    return;
                }

                if(td.status !== 'active'){
                    // waiting
                    setStatusBadge('● WAITING', '#9db5d3');
                    document.getElementById('info-card').style.display = 'block';
                    document.getElementById('form-panel').style.display = 'block';
                    loadParticipantInfo(false);
                    waitingState();
                    // Poll until active
                    statusPoll = setInterval(async function(){
                        try {
                            var r = await fetch(API_BASE+'/api/fizzbuzz/toggle');
                            var d = r.ok ? await r.json() : {};
                            if(d.status === 'active'){ clearInterval(statusPoll); loadPage(); }
                            else if(d.status === 'closed'){ clearInterval(statusPoll); closedState(); }
                        } catch(e){}
                    }, 3000);
                    return;
                }

                // ── ACTIVE ──
                setStatusBadge('● ACTIVE', 'var(--green-accent)');
                document.getElementById('info-card').style.display  = 'block';
                document.getElementById('form-panel').style.display = 'block';
                startStatusPoll();

            } catch(e){
                // Network error — show form anyway, don't block participant
                document.getElementById('info-card').style.display  = 'block';
                document.getElementById('form-panel').style.display = 'block';
                setStatusBadge('● CONNECTING…', '#9db5d3');
                setTimeout(loadPage, 4000);
            }

            // 2. Load participant info
            loadParticipantInfo(true);
        }

        async function loadParticipantInfo(startLock){
            try {
                var ar = await fetch(API_BASE+'/api/fizzbuzz/status/'+PARTICIPANT_ID);
                var ad = ar.ok ? await ar.json() : { success:false };

                document.getElementById('info-name').innerText = PARTICIPANT_NAME || (ad.success ? ad.participant_name : '') || '--';
                document.getElementById('info-team').innerText = ORIGINAL_TEAM || '--';

                // Resolve shuffled group
                var resolvedGroup = (ad.success && ad.shuffled_group) || localStorage.getItem('fizzbuzz_group') || '';
                if(!resolvedGroup){
                    try {
                        var mr = await fetch(API_BASE+'/api/my-assignment/'+PARTICIPANT_ID);
                        var md = mr.ok ? await mr.json() : {};
                        if(md.success && md.assignment && md.assignment.shuffled_group)
                            resolvedGroup = md.assignment.shuffled_group;
                    } catch(e2){}
                }
                var groupEl = document.getElementById('info-group');
                if(resolvedGroup){ groupEl.innerText = resolvedGroup; localStorage.setItem('fizzbuzz_group', resolvedGroup); }
                else { groupEl.innerText = '--'; }

                // Already submitted by this group?
                if(ad.success && (ad.group_submitted || ad.fizzbuzz_locked)){
                    var sub = ad.group_submission;
                    var locked = document.getElementById('locked-notice');
                    locked.innerHTML = '🔒 <strong>SUBMITTED</strong>'
                        + (sub ? '<br>Submitted by: '+ escHtml(sub.submitted_by) + '<br>Time: ' + new Date(sub.submitted_at).toLocaleTimeString() : '')
                        + '<br><span style="font-size:0.8rem;color:#9db5d3;">Waiting for coordinator scoring.</span>';
                    locked.style.display = 'block';
                    document.getElementById('fizzbuzz-form').style.display = 'none';
                    clearInterval(lockPollInterval);
                    return;
                }

                // Save to localStorage cache for reload resilience
                localStorage.setItem('fizzbuzz_participant_cache', JSON.stringify({
                    id:    PARTICIPANT_ID,
                    name:  document.getElementById('info-name').innerText || '',
                    team:  document.getElementById('info-team').innerText || '',
                    group: resolvedGroup || '',
                    submitted: !!(ad.success && (ad.group_submitted || ad.fizzbuzz_locked)),
                    submittedBy: (ad.success && ad.group_submission && ad.group_submission.submitted_by) || '',
                    submittedAt: (ad.success && ad.group_submission && ad.group_submission.submitted_at) || ''
                }));

                // Start group lock poll so this participant sees when another group member submits
                if(startLock) startLockPoll();

            } catch(e){ console.error('[participant info]', e); }
        }

        // ── Poll for group lock ───────────────────────────────────────────────
        function startLockPoll(){
            clearInterval(lockPollInterval);
            lockPollInterval = setInterval(async function(){
                try {
                    var r = await fetch(API_BASE+'/api/fizzbuzz/status/'+PARTICIPANT_ID);
                    if(!r.ok) return;
                    var d = await r.json();
                    if(d.success && (d.group_submitted || d.fizzbuzz_locked)){
                        clearInterval(lockPollInterval);
                        var sub = d.group_submission;
                        var locked = document.getElementById('locked-notice');
                        locked.innerHTML = '🔒 <strong>SUBMITTED</strong>'
                            + (sub ? '<br>Submitted by: '+ escHtml(sub.submitted_by) + '<br>Time: ' + new Date(sub.submitted_at).toLocaleTimeString() : '');
                        locked.style.display = 'block';
                        document.getElementById('fizzbuzz-form').style.display = 'none';
                    }
                } catch(e){}
            }, 4000);
        }

        function escHtml(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

        // ── Submit code ───────────────────────────────────────────────────────
        async function submitCode(e){
            e.preventDefault();
            var code = document.getElementById('code-area').value.trim();
            var lang = document.getElementById('lang-select').value;
            var btn  = document.getElementById('submit-btn');
            var msg  = document.getElementById('status-msg');
            if(!code){ alert('Please paste your FizzBuzz solution.'); return; }

            btn.disabled = true; btn.textContent = 'SUBMITTING...';
            msg.style.display = 'none';
            try {
                var res = await fetch(API_BASE+'/api/fizzbuzz/submit-v2', {
                    method:'POST', headers:{'Content-Type':'application/json'},
                    body: JSON.stringify({ participant_id: PARTICIPANT_ID, fizz_output: code, language: lang })
                });
                var data = await res.json();

                if(res.status === 409){
                    var locked = document.getElementById('locked-notice');
                    locked.innerText = '🔒 Your group has already submitted.';
                    locked.style.display = 'block';
                    document.getElementById('fizzbuzz-form').style.display = 'none';
                    return;
                }
                if(res.ok && data.success){
                    clearInterval(lockPollInterval);
                    btn.disabled = true; btn.textContent = 'SUBMITTED';
                    document.getElementById('code-area').disabled = true;
                    msg.style.display = 'block'; msg.className = 'status-msg';
                    msg.innerHTML = '&#10003; SOLUTION SUBMITTED SUCCESSFULLY!<br>'
                        + '<strong>Group:</strong> ' + escHtml(data.shuffled_group||'--') + '<br>'
                        + '<strong>Submitted by:</strong> ' + escHtml(data.submitted_by||'--') + '<br>'
                        + '<strong>Language:</strong> ' + escHtml(lang);
                    // Persist submitted state so reload shows it correctly
                    try {
                        var prev = JSON.parse(localStorage.getItem('fizzbuzz_participant_cache') || '{}');
                        prev.submitted   = true;
                        prev.submittedBy = data.submitted_by || '';
                        prev.submittedAt = new Date().toISOString();
                        localStorage.setItem('fizzbuzz_participant_cache', JSON.stringify(prev));
                    } catch(e) {}
                    return;
                }
                msg.style.display = 'block'; msg.className = 'status-msg error';
                msg.innerText = (data && data.message) || 'Submission failed.';
                btn.disabled = false; btn.textContent = 'SUBMIT SOLUTION';
            } catch(err){
                msg.style.display = 'block'; msg.className = 'status-msg error';
                msg.innerText = 'Unable to reach server. Please try again.';
                btn.disabled = false; btn.textContent = 'SUBMIT SOLUTION';
            }
        }

        loadPage();
    </script>
</body>
</html>
